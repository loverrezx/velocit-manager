[package]
name = "velocit-manager-setup"
version = "0.1.2"
edition = "2021"

[build-dependencies]
winres = "0.1"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
